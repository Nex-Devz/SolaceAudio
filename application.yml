server:
  port: 2333
  address: 0.0.0.0

lavalink:
  # The official YouTube plugin is hosted on the Lavalink snapshot repository.
  defaultPluginSnapshotRepository: "https://maven.lavalink.dev/snapshots"

  plugins:
    # SolaceAudio Multi-Source Audio Engine (JioSaavn, Spotify, Deezer, Apple Music, Amazon, Gaana)
    - dependency: "com.github.Nex-Devz.SolaceAudio:solaceaudio-plugin:1.0.32"
      repository: "https://jitpack.io"

    # Official YouTube source. SolaceAudio detects this plugin and layers its oEmbed metadata
    # repair, mirror fallback and disk cache on top of it.
    - dependency: "dev.lavalink.youtube:youtube-plugin:2be8e542d3f6f178e048dca565892684c2e40177"
      snapshot: true

    # LavaLyrics: Synchronized & plain-text lyrics API (natively integrated with SolaceAudio)
    - dependency: "com.github.topi314.lavalyrics:lavalyrics-plugin:1.0.0"
      repository: "https://maven.lavalink.dev/releases"

  server:
    password: "youshallnotpass"
    sources:
      youtube: false # Provided by the official youtube-plugin above, wrapped by SolaceAudio
      bandcamp: true
      soundcloud: true
      twitch: true
      vimeo: true
      http: true
      local: false
    bufferDurationMs: 400
    frameBufferDurationMs: 5000
    opusEncodingQuality: 10 # Maximum Opus encoding quality (Hi-Fi 10/10)
    resamplingQuality: HIGH # High-fidelity polyphase/sinc audio resampling
    trackStuckThresholdMs: 10000
    useSeekGhosting: true # Smooth seek transitions without audio pops
    playerUpdateInterval: 5 # Real-time player progress updates in seconds
    youtubePlaylistLoadLimit: 100

plugins:
  # Official YouTube source (dev.lavalink.youtube). SolaceAudio detects this plugin at startup
  # and layers its oEmbed metadata repair, mirror fallback and disk cache on top of it.
  youtube:
    enabled: true
    allowSearch: true
    allowDirectVideoIds: true
    allowDirectPlaylistIds: true
    # Clients are tried in order until one yields a playable stream. ANDROID and IOS are listed
    # first because they return stream URLs that carry no encrypted signature, so they need less
    # deciphering than the clients behind them.
    clients:
      - ANDROID
      - IOS
      - ANDROID_VR
      - MUSIC
      - WEB
      - MWEB
      - TV
    # Signature deciphering is performed locally by the plugin, so no external cipher service
    # is required. Uncomment to offload deciphering to a remote service instead.
    # remoteCipher:
    #   url: "https://cipher.kikkia.dev/"
    #   userAgent: "Mozilla/5.0"
    # PoToken: supply a token and matching visitor data to lift bot checks on datacenter IPs.
    pot:
      token: ""
      visitorData: ""
    # OAuth with a YouTube account raises the API quota ceiling considerably.
    oauth:
      enabled: false
      refreshToken: ""
      skipInitialization: false

  solaceaudio:
    # Zero-transcode Opus pass-through mode: skips PCM float conversion
    # when no DSP audio filters (ducking) are active, reducing CPU usage by ~60%
    passthrough: false

    sources:
      spotify: true
      jiosaavn: true
      gaana: true
      amazonmusic: true
      deezer: true
      pandora: true
      youtube: true
      flowerytts: true
      applemusic: true
      audiomack: true
      shazam: true

    providers:
      # Resolution mirror ladder tried in order when resolving external tracks:
      - "spsearch:\"{isrc}\""
      - "spsearch:{query}"
      - "dzisrc:{isrc}"
      - "dzsearch:{query}"
      - "ytsearch:\"{isrc}\""
      - "ytsearch:{query}"
      - "jssearch:\"{isrc}\""
      - "jssearch:{query}"
      - "azsearch:{query}"
      - "scsearch:{query}"
      - "bcsearch:{query}"

    spotify:
      countryCode: "US"
      playlistLoadLimit: 100 # Maximum tracks fetched per playlist
      albumLoadLimit: 50
      resolveArtistsInSearch: true
      localFiles: false
      # OPTIONAL: Web player 'sp_dc' cookie from open.spotify.com.
      # SolaceAudio works 100% WITHOUT credentials via built-in anonymous token negotiation.
      # Adding spDc unlocks Spotify Canvas, synchronized lyrics, and personalized playlists.
      spDc: ""

    applemusic:
      countryCode: "us"
      playlistLoadLimit: 100
      albumLoadLimit: 50
      artistLoadLimit: 50

    jiosaavn:
      # Official API with in-process DES direct CDN streaming (Zero proxy needed!)
      apiUrl: "https://www.jiosaavn.com/api.php"
      playlistLoadLimit: 100
      # Audio streaming bitrate: "320kbps" (Maximum Hi-Fi CD Quality), "160kbps" (Balanced), "96kbps", or "48kbps"
      quality: "320kbps"

    gaana:
      # Public endpoint or self-host via https://github.com/notdeltaxd/Gaana-API on Vercel
      apiUrl: "https://gaana-plugin-api.vercel.app/api"
      playlistLoadLimit: 100
      albumLoadLimit: 50
      artistLoadLimit: 50
      searchLimit: 50

    amazonmusic:
      # Built-in native MESK catalog engine with zero external proxy requirement!
      # Backup proxy: https://github.com/Nex-Devz/amazon-music-api deployed on Vercel
      apiUrl: "https://amazon-music-api-dun.vercel.app/api"
      playlistLoadLimit: 100
      albumLoadLimit: 50
      artistLoadLimit: 50

    deezer:
      # Official public API with native Blowfish-CBC stream decryption (Zero proxy needed!)
      apiUrl: "https://api.deezer.com"
      # OPTIONAL: Deezer web 'arl' cookie for authenticated direct Hi-Fi FLAC/MP3 streaming.
      # SolaceAudio works out-of-the-box without credentials via public 128kbps streams.
      arl: ""
      masterKey: "g4el58wc0zvf9na1"
      playlistLoadLimit: 100
      albumLoadLimit: 50
      artistLoadLimit: 50
      searchLimit: 50

    pandora:
      csrfToken: ""
      searchLimit: 25

    flowerytts:
      voice: "en-US-Standard-A"
      speed: 1.0

    audiomack:
      # Official public API with OAuth 1.0 HMAC-SHA1 direct CloudFront CDN streaming (Zero proxy needed!)
      playlistLoadLimit: 50

    shazam:
      # Official Apple Music & Shazam discovery track search & recognition engine
      searchLimit: 25

    youtube:
      # Lightweight oEmbed metadata resolution (bypasses datacenter bot blocks on direct track URLs)
      oembed: true
      # Intelligent mirror fallback if direct YouTube playback is blocked on host IP
      mirror: true
      # Mirror providers are tried in order when direct YouTube playback fails. Leave empty to
      # use the built-in cross-service list (Spotify, Deezer, JioSaavn, Apple Music, Amazon Music).
      mirrorProviders: []
      nativeSource: false
      localDiskCache: true
      diskCachePath: "youtube-cache"
      maxDiskCacheMb: 10240
      cipherUrl: "https://cipher.kikkia.dev"
      # OPTIONAL: Burner cookie file (recommended for datacenter IPs to bypass PoToken / bot checks)
      cookieFile: "ytburner.txt"
      # Free 24/7 Auto-rotated PoToken generator (hosted on Vercel)
      potokenUrl: "https://potoken-generator.vercel.app/token"
      potokenVisitorData: ""
      potoken: ""

    lastfm:
      # OPTIONAL: Free API key from https://www.last.fm/api/account/create for scrobbling and recommendations
      apiKey: ""

    lyrics:
      enabled: true
      # High-speed fallback chain for synchronized and plain-text lyrics (Zero API keys needed!)
      sources:
        - "lrclib"
        - "deezer"
        - "genius"
        - "spotify"

    sponsorblock:
      enabled: true
      # Categories to automatically skip during YouTube audio playback
      categories:
        - "sponsor"
        - "selfpromo"
        - "interaction"
        - "intro"
        - "outro"

metrics:
  prometheus:
    enabled: false
    endpoint: /metrics

sentry:
  dsn: ""
  environment: ""

logging:
  file:
    path: ./logs/
  level:
    root: INFO
    lavalink: INFO
    com.solaceaudio: INFO
