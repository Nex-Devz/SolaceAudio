server:
  port: 2333
  address: 0.0.0.0

lavalink:
  plugins:
    # SolaceAudio Multi-Source Audio Engine
    - dependency: "com.github.Nex-Devz.SolaceAudio:solaceaudio-plugin:1.0.17"
      repository: "https://jitpack.io"


  server:
    password: "youshallnotpass"
    sources:
      youtube: false # Handled natively by SolaceAudio / youtube plugin
      bandcamp: true
      soundcloud: true
      twitch: true
      vimeo: true
      http: true
      local: false
    bufferDurationMs: 400
    frameBufferDurationMs: 5000
    opusEncodingQuality: 10
    resamplingQuality: HIGH
    trackStuckThresholdMs: 10000
    playerUpdateInterval: 5

plugins:
  solaceaudio:
    sources:
      spotify: true
      jiosaavn: true
      gaana: true
      amazonmusic: true
      deezer: true
      pandora: true
      youtube: true
      flowerytts: true

    providers:
      - "dzisrc:{isrc}"
      - "ytsearch:\"{isrc}\""
      - "ytsearch:{query}"
      - "scsearch:{query}"
      - "bcsearch:{query}"

    spotify:
      countryCode: "US"
      playlistLoadLimit: 6
      albumLoadLimit: 6
      resolveArtistsInSearch: true
      localFiles: false
      spDc: ""

    jiosaavn:
      # Official API with in-process DES/320kbps direct CDN streaming (Zero proxy needed!)
      apiUrl: "https://www.jiosaavn.com/api.php"
      playlistLoadLimit: 50

    gaana:
      # Public endpoint or self-host via https://github.com/notdeltaxd/Gaana-API on Vercel
      apiUrl: "https://gaana-plugin-api.vercel.app/api"
      playlistLoadLimit: 50
      albumLoadLimit: 50
      artistLoadLimit: 50
      searchLimit: 25

    amazonmusic:
      # Self-hosted via https://github.com/Nex-Devz/amazon-music-api on Vercel
      apiUrl: "https://amazon-music-api-dun.vercel.app/api"
      playlistLoadLimit: 50
      albumLoadLimit: 50
      artistLoadLimit: 50

    deezer:
      # Official public API for ISRC and metadata resolution (Zero proxy needed!)
      apiUrl: "https://api.deezer.com"
      playlistLoadLimit: 50
      albumLoadLimit: 50
      artistLoadLimit: 50
      searchLimit: 25

    pandora:
      csrfToken: ""
      searchLimit: 10

    flowerytts:
      voice: "en-US-Standard-A"
      speed: 1.0

    youtube:
      oembed: false
      mirror: true
      mirrorProviders:
        - "ytmsearch:%QUERY%"
        - "scsearch:%QUERY%"
      localDiskCache: true
      diskCachePath: "youtube-cache"
      maxDiskCacheMb: 10240
      cipherUrl: "https://cipher.kikkia.dev"
      # Burner cookie file (recommended for datacenter IPs - bypasses PoToken requirements)
      cookieFile: "ytburner.txt"
      # Free 24/7 Auto-rotated PoToken generator (hosted on Vercel)
      potokenUrl: "https://potoken-generator.vercel.app/token"
      # Optional: Static manual PoToken & Visitor Data fallback
      potokenVisitorData: ""
      potoken: ""

    lastfm:
      apiKey: ""

metrics:
  prometheus:
    enabled: false
    endpoint: /metrics

sentry:
  dsn: ""
  environment: ""

logging:
  file:
    path: ./logs/
  level:
    root: INFO
    lavalink: INFO
    com.solaceaudio: INFO
