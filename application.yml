server:
  port: 2333
  address: 0.0.0.0

lavalink:
  # The official YouTube plugin is hosted on the Lavalink snapshot repository.
  defaultPluginSnapshotRepository: "https://maven.lavalink.dev/snapshots"

  plugins:
    # SolaceAudio Multi-Source Audio Engine
    - dependency: "com.github.Nex-Devz.SolaceAudio:solaceaudio-plugin:1.0.29"
      repository: "https://jitpack.io"

    # Official YouTube source. SolaceAudio detects this plugin and layers its oEmbed metadata
    # repair, mirror fallback and disk cache on top of it. It is pinned to a snapshot build on
    # purpose: the 1.18.x release line still ships InnerTube client versions that YouTube
    # rejects with HTTP 400, which breaks playback.
    - dependency: "dev.lavalink.youtube:youtube-plugin:2be8e542d3f6f178e048dca565892684c2e40177"
      snapshot: true

  server:
    password: "youshallnotpass"
    sources:
      youtube: false # Provided by the official youtube-plugin above, wrapped by SolaceAudio
      bandcamp: true
      soundcloud: true
      twitch: true
      vimeo: true
      http: true
      local: false
    bufferDurationMs: 400
    frameBufferDurationMs: 5000
    opusEncodingQuality: 10
    resamplingQuality: HIGH
    trackStuckThresholdMs: 10000
    playerUpdateInterval: 5

plugins:
  # Official YouTube source (dev.lavalink.youtube). SolaceAudio detects this plugin at startup
  # and layers its oEmbed metadata repair, mirror fallback and disk cache on top of it.
  youtube:
    enabled: true
    allowSearch: true
    allowDirectVideoIds: true
    allowDirectPlaylistIds: true
    # Clients are tried in order until one yields a playable stream. ANDROID and IOS are listed
    # first because they return stream URLs that carry no encrypted signature, so they need less
    # deciphering than the clients behind them.
    clients:
      - ANDROID
      - IOS
      - ANDROID_VR
      - MUSIC
      - WEB
      - MWEB
      - TV
    # Signature deciphering is performed locally by the plugin, so no external cipher service
    # is required. Uncomment to offload deciphering to a remote service instead.
    # remoteCipher:
    #   url: "https://cipher.kikkia.dev/"
    #   userAgent: "Mozilla/5.0"
    # PoToken: supply a token and matching visitor data to lift bot checks on datacenter IPs.
    pot:
      token: ""
      visitorData: ""
    # OAuth with a YouTube account raises the API quota ceiling considerably.
    oauth:
      enabled: false
      refreshToken: ""
      skipInitialization: false

  solaceaudio:
    # Zero-transcode Opus pass-through mode: skips PCM float conversion
    # when no DSP audio filters (ducking) are active, reducing CPU usage by ~60%
    passthrough: false

    sources:
      spotify: true
      jiosaavn: true
      gaana: true
      amazonmusic: true
      deezer: true
      pandora: true
      youtube: true
      flowerytts: true
      applemusic: true

    providers:
      - "dzisrc:{isrc}"
      - "ytsearch:\"{isrc}\""
      - "ytsearch:{query}"
      - "bcsearch:{query}"

    spotify:
      countryCode: "US"
      playlistLoadLimit: 6
      albumLoadLimit: 6
      resolveArtistsInSearch: true
      localFiles: false
      spDc: ""

    applemusic:
      countryCode: "us"
      playlistLoadLimit: 50
      albumLoadLimit: 50
      artistLoadLimit: 50

    jiosaavn:
      # Official API with in-process DES direct CDN streaming (Zero proxy needed!)
      apiUrl: "https://www.jiosaavn.com/api.php"
      playlistLoadLimit: 50
      # Audio streaming bitrate: "320kbps" (Hi-Fi), "160kbps" (Balanced - saves 50% bandwidth), "96kbps", or "48kbps"
      quality: "320kbps"

    gaana:
      # Public endpoint or self-host via https://github.com/notdeltaxd/Gaana-API on Vercel
      apiUrl: "https://gaana-plugin-api.vercel.app/api"
      playlistLoadLimit: 50
      albumLoadLimit: 50
      artistLoadLimit: 50
      searchLimit: 25

    amazonmusic:
      # Self-hosted via https://github.com/Nex-Devz/amazon-music-api on Vercel
      apiUrl: "https://amazon-music-api-dun.vercel.app/api"
      playlistLoadLimit: 50
      albumLoadLimit: 50
      artistLoadLimit: 50

    deezer:
      # Official public API with native Blowfish-CBC stream decryption (Zero proxy needed!)
      apiUrl: "https://api.deezer.com"
      arl: "" # Optional Deezer ARL cookie for authenticated HiFi streaming
      masterKey: "g4el58wc0zvf9na1"
      playlistLoadLimit: 50
      albumLoadLimit: 50
      artistLoadLimit: 50
      searchLimit: 25

    pandora:
      csrfToken: ""
      searchLimit: 10

    flowerytts:
      voice: "en-US-Standard-A"
      speed: 1.0

    youtube:
      # Lightweight oEmbed metadata resolution (bypasses datacenter bot blocks on direct track URLs)
      oembed: true
      # Intelligent mirror fallback if direct YouTube playback is blocked on host IP
      mirror: true
      # Mirror providers are tried in order when direct YouTube playback fails. Leave empty to
      # use the built-in cross-service list (Spotify, Deezer, JioSaavn, Apple Music), which are
      # the only providers that can rescue a track when YouTube itself is unreachable.
      # Supported placeholders: %QUERY% / {query} and %ISRC% / {isrc}.
      mirrorProviders: []
      # Use SolaceAudio's built-in YouTube source instead of the official plugin above.
      # The official plugin tracks YouTube's client changes far more closely, so the built-in
      # source is a fallback rather than the default.
      nativeSource: false
      # Override the InnerTube client version strings, keyed by client name. YouTube rejects
      # outdated client versions without notice, and these can be corrected from configuration
      # instead of waiting for a plugin release.
      # clientVersions:
      #   ANDROID: "21.02.35"
      #   IOS: "21.32.4"
      localDiskCache: true
      diskCachePath: "youtube-cache"
      maxDiskCacheMb: 10240
      cipherUrl: "https://cipher.kikkia.dev"
      # Burner cookie file (recommended for datacenter IPs - bypasses PoToken requirements)
      cookieFile: "ytburner.txt"
      # Free 24/7 Auto-rotated PoToken generator (hosted on Vercel)
      potokenUrl: "https://potoken-generator.vercel.app/token"
      # Optional: Static manual PoToken & Visitor Data fallback
      potokenVisitorData: ""
      potoken: ""

    lastfm:
      apiKey: ""

    lyrics:
      enabled: true
      # Fallback chain for synchronized and plain-text lyrics (no API keys required!)
      sources:
        - "lrclib"
        - "deezer"
        - "genius"
        - "spotify"

    sponsorblock:
      enabled: true
      # Categories to automatically skip during YouTube audio playback
      categories:
        - "sponsor"
        - "selfpromo"
        - "interaction"
        - "intro"
        - "outro"

metrics:
  prometheus:
    enabled: false
    endpoint: /metrics

sentry:
  dsn: ""
  environment: ""

logging:
  file:
    path: ./logs/
  level:
    root: INFO
    lavalink: INFO
    com.solaceaudio: INFO
