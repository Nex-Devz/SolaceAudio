name: Publish Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish:
    name: Build & Release Artifacts
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Build Release Plugin
        run: ./gradlew build -x test

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: plugin/build/libs/solaceaudio-plugin-*.jar
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Send Discord Changelog Webhook
        if: success()
        run: |
          curl -H "Content-Type: application/json" -X POST \
            -d "{\"embeds\":[{\"title\":\"SolaceAudio Release ${{ github.ref_name }}\",\"url\":\"https://github.com/Nex-Devz/SolaceAudio/releases/tag/${{ github.ref_name }}\",\"description\":\"A new release of **SolaceAudio (${{ github.ref_name }})** has been published.\n\n### Commit / Release Details\n- **Tag:** ${{ github.ref_name }}\n- **Commit:** ${{ github.sha }}\n- **Release Notes:** [View Release Notes](https://github.com/Nex-Devz/SolaceAudio/releases/tag/${{ github.ref_name }})\n- **Artifact:** [Download solaceaudio-plugin.jar](https://github.com/Nex-Devz/SolaceAudio/releases/download/${{ github.ref_name }}/solaceaudio-plugin.jar)\",\"color\":4359924,\"footer\":{\"text\":\"Nex Devz Infrastructure\"}}]}" \
            "https://discord.com/api/webhooks/1557065637950652557/Y5-F5nDEMvN3xKatZkWrFzibVd-zSk06QyHE3sTzUki74NuUB2K0cksmVhd_oAYdaxEW"
