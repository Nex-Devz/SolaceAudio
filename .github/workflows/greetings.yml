name: Greetings

on:
  pull_request_target:
    types: [opened]
  issues:
    types: [opened]

permissions:
  pull-requests: write
  issues: write

jobs:
  greeting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/first-interaction@v1
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          issue-message: '👋 Welcome to **SolaceAudio**, @${{ github.actor }}! Thank you for opening this issue. Our maintainers will review it as soon as possible. Feel free to provide extra details or logs if applicable!'
          pr-message: '🚀 Welcome to **SolaceAudio**, @${{ github.actor }}! Thank you for your contribution. Please ensure your PR passes our CI checks and follows our coding standards. A maintainer will review your changes shortly.'
